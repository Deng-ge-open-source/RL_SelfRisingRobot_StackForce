<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#c33045" /></marker></defs><rect width="1600" height="900" fill="#f4f7fa" /><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="52" y="52" font-size="20" fill="#176a8d" font-weight="700">STACKFORCE / SELFRISING</text><text x="52" y="112" font-size="42" fill="#142c43" font-weight="700">Calibrate: centre → align → save</text><text x="54" y="158" font-size="24" fill="#5b6d7c" font-weight="400">Calibrate lower A0 first, then repeat for upper A1</text><rect x="35" y="200" width="700" height="640" rx="16" fill="#ffffff" /><g><rect x="60" y="215" width="650" height="610" rx="7" fill="#f8fafc" stroke="#cbd5e1" /><text x="82" y="245" font-family="Arial,sans-serif" font-size="19" fill="#142c43" font-weight="700" text-anchor="start">A0 · servo1_joint</text><text x="690" y="245" font-family="Arial,sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="end">MG90S · GPIO25</text><rect x="80" y="267" width="190" height="44" rx="5" fill="#161616" stroke="#cbd5e1" /><text x="175.0" y="295" font-family="Arial,sans-serif" font-size="18" fill="#ffd32a" font-weight="700" text-anchor="middle">Calibration</text><rect x="277" y="267" width="190" height="44" rx="5" fill="white" stroke="#cbd5e1" /><text x="372.0" y="295" font-family="Arial,sans-serif" font-size="18" fill="#334155" font-weight="700" text-anchor="middle">Joint test</text><rect x="474" y="267" width="216" height="44" rx="5" fill="white" stroke="#cbd5e1" /><text x="582.0" y="295" font-family="Arial,sans-serif" font-size="18" fill="#334155" font-weight="700" text-anchor="middle">Parameters</text><text x="80" y="348" font-family="Arial,sans-serif" font-size="20" fill="#142c43" font-weight="700" text-anchor="start">Position calibration</text><rect x="548" y="321" width="140" height="39" rx="5" fill="#e2f6ec" stroke="#7dbc98" /><text x="618" y="347" font-family="Arial,sans-serif" font-size="17" fill="#177346" font-weight="700" text-anchor="middle">Enabled · Off</text><text x="80" y="389" font-family="Arial,sans-serif" font-size="17" fill="#1f2937" font-weight="400" text-anchor="start">Neutral angle (°)</text><rect x="80" y="401" width="608" height="48" rx="5" fill="white" stroke="#cbd5e1" /><text x="95" y="433" font-family="Arial,sans-serif" font-size="21" fill="#1f2937" font-weight="400" text-anchor="start">90</text><text x="80" y="487" font-family="Arial,sans-serif" font-size="17" fill="#1f2937" font-weight="400" text-anchor="start">Commanded position</text><text x="686" y="487" font-family="Arial,sans-serif" font-size="17" fill="#142c43" font-weight="700" text-anchor="end">90.0° · target</text><rect x="80" y="512" width="608" height="8" rx="4" fill="#e4e7eb" stroke="none" /><rect x="80" y="512" width="304" height="8" rx="4" fill="#1487b5" stroke="none" /><circle cx="384" cy="516" r="12" fill="#1487b5" /><text x="80" y="551" font-family="Arial,sans-serif" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">0°</text><text x="384" y="551" font-family="Arial,sans-serif" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">90° centre · 1500 µs</text><text x="688" y="551" font-family="Arial,sans-serif" font-size="16" fill="#64748b" font-weight="400" text-anchor="end">180°</text><rect x="80" y="574" width="160" height="47" rx="5" fill="white" stroke="#cbd5e1" /><text x="160.0" y="605" font-family="Arial,sans-serif" font-size="19" fill="#111827" font-weight="700" text-anchor="middle">−1°</text><rect x="248" y="574" width="272" height="47" rx="5" fill="white" stroke="#cbd5e1" /><text x="384.0" y="605" font-family="Arial,sans-serif" font-size="19" fill="#111827" font-weight="700" text-anchor="middle">Return to centre</text><rect x="528" y="574" width="160" height="47" rx="5" fill="white" stroke="#cbd5e1" /><text x="608.0" y="605" font-family="Arial,sans-serif" font-size="19" fill="#111827" font-weight="700" text-anchor="middle">+1°</text><rect x="80" y="639" width="300" height="47" rx="5" fill="#ffd32a" stroke="#d7bd4a" /><text x="230.0" y="670" font-family="Arial,sans-serif" font-size="17" fill="#142c43" font-weight="700" text-anchor="middle">Set current position as zero</text><rect x="388" y="639" width="300" height="47" rx="5" fill="#ffe898" stroke="#d7bd4a" /><text x="538.0" y="670" font-family="Arial,sans-serif" font-size="17" fill="#142c43" font-weight="700" text-anchor="middle">Save to device</text><text x="80" y="729" font-family="Arial,sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Model 0° ↔ Servo 90.0° · saved reference</text><text x="80" y="791" font-family="Arial,sans-serif" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">English control illustration · example values</text></g><text x="780" y="295" font-size="25" fill="#142c43" font-weight="700">1. Select A0, then Calibration</text><text x="780" y="345" font-size="21" fill="#5b6d7c" font-weight="400">Choose the lower servo in the mapping</text><text x="780" y="440" font-size="25" fill="#142c43" font-weight="700">2. Enable and Return to Centre</text><text x="780" y="490" font-size="21" fill="#5b6d7c" font-weight="400">Move the servo to its centre first</text><text x="780" y="585" font-size="25" fill="#142c43" font-weight="700">3. Align the link and fit the horn</text><text x="780" y="635" font-size="21" fill="#5b6d7c" font-weight="400">Seat the horn in the printed slot</text><text x="780" y="730" font-size="25" fill="#142c43" font-weight="700">4. Save, then repeat for A1</text><text x="780" y="780" font-size="21" fill="#5b6d7c" font-weight="400">Check direction and travel in Joint Test</text></g></svg>